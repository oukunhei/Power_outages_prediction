[project]
name = "power-outage-prediction"
version = "0.1.0"
description = "One-time data ingestion, fixed-formula outage risk scoring, and interactive visualization."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dask[array]>=2024.7.1",
    "geopandas>=1.0.1",
    "matplotlib>=3.9.1",
    "netcdf4>=1.7.1.post2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "plotly>=5.23.0",
    "pyarrow>=17.0.0",
    "pydantic-settings>=2.3.4",
    "pyyaml>=6.0.1",
    "regionmask>=0.12.1",
    "rioxarray>=0.17.0",
    "streamlit>=1.37.0",
    "xarray>=2024.7.0",
]

[project.scripts]
outage-prediction = "outage_prediction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outage_prediction"]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
